<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HappyStupidChild — 保持好奇，持续探索</title>
  <desc id="desc">带有霓虹光效、轨道粒子和动态网格的中文个人主页横幅。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816">
        <animate attributeName="stop-color" values="#050816;#071A2B;#050816" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#0C1633">
        <animate attributeName="stop-color" values="#0C1633;#15103A;#0C1633" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#240B36">
        <animate attributeName="stop-color" values="#240B36;#071C34;#240B36" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="neon" x1="340" y1="105" x2="875" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EFCE8">
        <animate attributeName="stop-color" values="#5EFCE8;#60A5FA;#5EFCE8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA;#C084FC;#60A5FA" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#E879F9">
        <animate attributeName="stop-color" values="#E879F9;#5EFCE8;#E879F9" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientTransform="translate(160 62) rotate(28) scale(440 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0" cy="0" r="1" gradientTransform="translate(1040 326) rotate(-148) scale(470 270)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C026D3" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#B9CCF2" stroke-opacity="0.085"/>
    </pattern>
    <filter id="blur" x="-120" y="-120" width="1440" height="620" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="orbitLeft" d="M72 258C204 68 388 50 520 134"/>
    <path id="orbitRight" d="M680 235C830 330 1012 292 1134 93"/>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <ellipse cx="160" cy="62" rx="350" ry="190" fill="url(#glowCyan)">
      <animate attributeName="cx" values="130;245;130" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1040" cy="326" rx="380" ry="200" fill="url(#glowPurple)">
      <animate attributeName="cx" values="1070;950;1070" dur="9s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g opacity="0.78">
    <rect x="-36" y="-36" width="1272" height="452" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" values="0 0;36 36" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="none" stroke-linecap="round">
    <use href="#orbitLeft" stroke="#5EFCE8" stroke-opacity="0.28"/>
    <use href="#orbitRight" stroke="#D778FF" stroke-opacity="0.28"/>
    <ellipse cx="600" cy="190" rx="505" ry="137" stroke="#7DD3FC" stroke-opacity="0.1" stroke-dasharray="6 16">
      <animateTransform attributeName="transform" type="rotate" from="0 600 190" to="360 600 190" dur="28s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <circle r="6" fill="#5EFCE8" filter="url(#softGlow)">
    <animateMotion dur="5.4s" repeatCount="indefinite"><mpath href="#orbitLeft"/></animateMotion>
  </circle>
  <circle r="5" fill="#D778FF" filter="url(#softGlow)">
    <animateMotion dur="6.2s" repeatCount="indefinite"><mpath href="#orbitRight"/></animateMotion>
  </circle>

  <g fill="#EAF2FF">
    <circle cx="88" cy="85" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="178" cy="312" r="2"><animate attributeName="opacity" values="1;.15;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="276" cy="82" r="1.8"><animate attributeName="opacity" values=".15;.9;.15" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="956" cy="67" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1068" cy="287" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1121" cy="137" r="1.8"><animate attributeName="opacity" values="1;.15;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <g stroke="#75B8FF" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M106 122h34M123 105v34"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></path>
    <path d="M1054 238h38M1073 219v38"><animate attributeName="opacity" values="1;.25;1" dur="2.5s" repeatCount="indefinite"/></path>
  </g>

  <rect x="424" y="65" width="352" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
  <circle cx="447" cy="82" r="5" fill="#5EFCE8"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <text x="464" y="88" fill="#CCD9F2" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="1.4">系统在线 // 好奇心持续加载中</text>

  <text x="600" y="178" text-anchor="middle" fill="#F8FAFF" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="780" letter-spacing="5">保持好奇</text>
  <text x="600" y="246" text-anchor="middle" fill="url(#neon)" filter="url(#softGlow)" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="5">持续探索</text>

  <path d="M450 286H750" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="300" filter="url(#softGlow)">
    <animate attributeName="stroke-dashoffset" values="300;0;-300" dur="4s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="322" text-anchor="middle" fill="#9FB1D2" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="3">在开源世界里寻找有趣的答案</text>
  <rect x="742" y="309" width="8" height="15" rx="1" fill="#5EFCE8"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
