<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HappyStupidChild — Dream, Explore, Build</title>
  <desc id="desc">A dark gradient GitHub profile banner with stars and orbit lines.</desc>
  <defs>
    <linearGradient id="bg" x1="74" y1="20" x2="1130" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.54" stop-color="#111B38"/>
      <stop offset="1" stop-color="#21103A"/>
    </linearGradient>
    <linearGradient id="accent" x1="355" y1="110" x2="845" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8D1"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#D08AFF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(180 42) rotate(31) scale(420 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16C9AC" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#16C9AC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1040 320) rotate(-150) scale(460 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#C5D1E8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="blur" x="-100" y="-100" width="1400" height="560" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <ellipse cx="180" cy="42" rx="330" ry="175" fill="url(#glowA)"/>
    <ellipse cx="1040" cy="320" rx="370" ry="190" fill="url(#glowB)"/>
  </g>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <g opacity="0.72" stroke-linecap="round">
    <path d="M91 237C248 61 393 48 526 126" stroke="#67E8D1" stroke-opacity="0.28"/>
    <path d="M674 226C820 312 978 291 1118 105" stroke="#C084FC" stroke-opacity="0.28"/>
    <circle cx="91" cy="237" r="5" fill="#67E8D1" stroke="none"/>
    <circle cx="1118" cy="105" r="5" fill="#C084FC" stroke="none"/>
  </g>

  <g fill="#E7EEFF">
    <circle cx="95" cy="82" r="2" opacity="0.75"/>
    <circle cx="172" cy="294" r="2.5" opacity="0.6"/>
    <circle cx="1053" cy="274" r="2" opacity="0.65"/>
    <circle cx="1100" cy="67" r="2.5" opacity="0.7"/>
  </g>
  <path d="M104 110h30M119 95v30M1058 234h34M1075 217v34" stroke="#75B8FF" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

  <rect x="445" y="73" width="310" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.075" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="466" cy="89" r="5" fill="#67E8D1"/>
  <text x="483" y="95" fill="#CCD7EC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" letter-spacing="1.7">HELLO, I'M HAPPYSTUPIDCHILD</text>

  <text x="600" y="181" text-anchor="middle" fill="#F8FAFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="750" letter-spacing="-1.4">DREAM. EXPLORE.</text>
  <text x="600" y="246" text-anchor="middle" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="750" letter-spacing="-1.4">BUILD.</text>

  <path d="M477 284H723" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <circle cx="477" cy="284" r="4" fill="#67E8D1"/>
  <circle cx="723" cy="284" r="4" fill="#D08AFF"/>
</svg>
